[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permkit"
version = "0.1.0"
description = "Role-based authorization for Django: endpoint, object and field tiers, configured in data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "django>=5.2",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.15"]
dev = ["djangorestframework>=3.15", "pytest>=8", "pytest-django>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

# The preview screen's template. Without this it is missing from a built
# wheel and the admin page 500s on a real install but not in the repo.
[tool.setuptools.package-data]
permkit = ["templates/permkit/*.html"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
